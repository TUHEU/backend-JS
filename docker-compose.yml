version: "3.9"

# Only the gateway is reachable from outside this machine — the three
# backend services talk to each other and to the gateway over Docker's
# internal network (by service name), so they don't publish a host
# port at all. From the VPS's point of view, this stack uses exactly
# one port: 5004.
#
# restart: unless-stopped on every service means Docker's own daemon
# restarts them automatically after a crash AND after a VPS reboot
# (as long as the Docker daemon itself is set to start on boot, which
# it is by default on a systemd-based install like this Ubuntu VPS).
# "unless-stopped" specifically means: always restart, EXCEPT if you
# explicitly ran `docker compose stop` — so a deliberate stop stays
# stopped, but a crash or reboot doesn't leave it down.

services:
  user-service:
    build: ./user-service
    restart: unless-stopped
    environment:
      - GLOBETROTTER_SECRET=dev-secret-change-in-prod
      - PORT=5005
    volumes:
      - ./user-service/data:/app/data

  itinerary-service:
    build: ./itinerary-service
    restart: unless-stopped
    environment:
      - GLOBETROTTER_SECRET=dev-secret-change-in-prod
      - PORT=5006
    volumes:
      - ./itinerary-service/data:/app/data

  recommendation-service:
    build: ./recommendation-service
    restart: unless-stopped
    environment:
      - GLOBETROTTER_SECRET=dev-secret-change-in-prod
      - PORT=5007
      - USER_SERVICE_URL=http://user-service:5005
      - ITINERARY_SERVICE_URL=http://itinerary-service:5006
    volumes:
      - ./recommendation-service/data:/app/data
    depends_on: [user-service, itinerary-service]

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports: ["5004:5004"]   # <-- the only port this stack exposes
    environment:
      - PORT=5004
      - USER_SERVICE_URL=http://user-service:5005
      - ITINERARY_SERVICE_URL=http://itinerary-service:5006
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5007
    depends_on: [user-service, itinerary-service, recommendation-service]
